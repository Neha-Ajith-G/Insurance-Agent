services:
  backend:
    build: .
    container_name: insurance-api-backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - SECRET_KEY=insurance-agent-super-secret-jwt-key-2026
      - UPLOAD_DIR=/app/uploads
      - PIPELINE_LOG_PATH=/app/logs/pipeline_events.jsonl
      - AGENTIC_PIPELINE_LOG_PATH=/app/logs/agentic_pipeline_events.jsonl
    volumes:
      - ./auth.db:/app/auth.db
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: .
    container_name: insurance-streamlit-ui
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped